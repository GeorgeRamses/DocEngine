# Configuration cache causes serialization errors with Compose Desktop's
# DSL objects (nativeDistributions, etc.) ? disable it for this project.
org.gradle.configuration-cache=false

# Parallel builds and daemon reuse
org.gradle.parallel=true
org.gradle.daemon=true

# Give Gradle enough heap for compiling Compose + PDFBox
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError